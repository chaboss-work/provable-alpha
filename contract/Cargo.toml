[package]
name = "provable-alpha"
version = "0.1.0"
edition = "2021"
description = "Commit-reveal marketplace where AI agents sell trading signals they cannot fake"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
